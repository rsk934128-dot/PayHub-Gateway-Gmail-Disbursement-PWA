<!doctype html>
<html lang="en" class="light">
  <head>
    <script>
      try {
        var savedTheme = localStorage.getItem('payhub_theme') || 'light';
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
    <script>
      (function() {
        // Intercept WebSocket for vite-hmr to prevent connection errors
        try {
          var OriginalWS = window.WebSocket;
          if (OriginalWS) {
            function MockHmrWS(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('5173') !== -1 || url.indexOf('3000') !== -1))
              ) {
                var target = new EventTarget();
                target.url = url;
                target.readyState = 1;
                target.send = function() {};
                target.close = function() {
                  target.readyState = 3;
                };
                setTimeout(function() {
                  var evt = new Event('open');
                  if (typeof target.onopen === 'function') target.onopen(evt);
                  target.dispatchEvent(evt);
                }, 10);
                return target;
              }
              return new OriginalWS(url, protocols);
            }
            MockHmrWS.CONNECTING = 0;
            MockHmrWS.OPEN = 1;
            MockHmrWS.CLOSING = 2;
            MockHmrWS.CLOSED = 3;
            MockHmrWS.prototype = OriginalWS.prototype;
            window.WebSocket = MockHmrWS;
          }
        } catch (e) {}

        // Global console interceptor to silence harmless Vite HMR noise
        var methods = ['log', 'info', 'warn', 'error', 'debug', 'trace'];
        function isViteMsg(arg) {
          if (!arg) return false;
          var str = '';
          if (typeof arg === 'string') {
            str = arg;
          } else if (arg instanceof Error) {
            str = (arg.message || '') + ' ' + (arg.stack || '');
          } else {
            try { str = JSON.stringify(arg); } catch (e) { str = String(arg); }
          }
          var lower = str.toLowerCase();
          return str.indexOf('[vite]') !== -1 || lower.indexOf('websocket') !== -1 || lower.indexOf('vite-hmr') !== -1 || lower.indexOf('ws://') !== -1;
        }

        function wrapConsole(cons) {
          if (!cons) return;
          methods.forEach(function(m) {
            var orig = cons[m];
            if (typeof orig === 'function') {
              cons[m] = function() {
                for (var i = 0; i < arguments.length; i++) {
                  if (isViteMsg(arguments[i])) return;
                }
                return orig.apply(this, arguments);
              };
            }
          });
        }

        wrapConsole(window.console);

        try {
          var _console = window.console;
          Object.defineProperty(window, 'console', {
            configurable: true,
            enumerable: true,
            get: function() { return _console; },
            set: function(val) {
              wrapConsole(val);
              _console = val;
            }
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (isViteMsg(e.message) || isViteMsg(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteMsg(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
